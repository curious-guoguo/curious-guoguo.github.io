<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无聊的guoguo | 其他工具</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="sidebar"></div>
<main class="main-content">
    <div class="head-title">其他工具</div>
    <div class="card-container">
        <div class="link-card" onclick="window.open('https://tool.lu/','_blank')"><a href="https://tool.lu/" target="_blank">工具一堆</a></div>
        <div class="link-card" onclick="window.open('https://ssoier.cn/','_blank')"><a href="https://ssoier.cn/" target="_blank">工具二堆</a></div>
        <div class="link-card" onclick="window.open('https://www.saobby.com/','_blank')"><a href="https://www.saobby.com/" target="_blank">工具三堆</a></div>
        <div class="link-card" onclick="window.open('Note.ms','_blank')"><a href="Note.ms" target="_blank">云剪贴板</a></div>
        <div class="link-card" onclick="window.open('https://easychuan.cn/','_blank')"><a href="https://easychuan.cn/" target="_blank">轻松传</a></div>
        <div class="link-card" onclick="window.open('https://chat.deepseek.com/sign_in','_blank')"><a href="https://chat.deepseek.com/sign_in" target="_blank">深度求索</a></div>
    </div>
</main>
<script>
fetch('sidebar.html').then(res=>res.text()).then(html=>{
    document.getElementById('sidebar').innerHTML=html;
    let currentFile = window.location.href.split('/').pop();
    document.querySelectorAll('.sidebar a').forEach(item=>{
        if(item.getAttribute('href')===currentFile) item.classList.add('active');
    });
});
</script>
</body>
</html>
