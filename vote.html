<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="曾轶峡 个人主页 - 投票">
    <meta name="author" content="曾轶峡">
    <title>曾轶峡 | 投票</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 引入公共侧边栏 -->
    <div id="sidebar-container"></div>

    <main class="main-content">
        <div class="head-title">欢迎投票</div>
        <div class="vote-section">
            <table>
                <tr>
                    <td><img class="vote-img" src="https://vote.saobby.com/i/maNz2mYg/0?x-oss-process=image/resize,m_fill,h_170,w_225" loading="lazy"></td>
                    <td><a href="https://vote.saobby.com/v/maNz2mYg/0" target="_blank" rel="noopener">蒟蒻</a></td>
                </tr>
                <tr>
                    <td><img class="vote-img" src="https://vote.saobby.com/i/maNz2mYg/1?x-oss-process=image/resize,m_fill,h_170,w_225" loading="lazy"></td>
                    <td><a href="https://vote.saobby.com/v/maNz2mYg/1" target="_blank" rel="noopener">老六</a></td>
                </tr>
                <tr>
                    <td><img class="vote-img" src="https://vote.saobby.com/i/maNz2mYg/2?width=300" loading="lazy"></td>
                    <td><a href="https://vote.saobby.com/v/maNz2mYg/2" target="_blank" rel="noopener">大佬六</a></td>
                </tr>
            </table>
        </div>
    </main>

    <!-- 引入sidebar.html的JS -->
    <script>
        // 加载公共侧边栏
        fetch('sidebar.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;
            })
            .catch(error => console.error('加载侧边栏失败:', error));
    </script>
</body>
</html>
