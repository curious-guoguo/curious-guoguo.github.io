<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="curious-guoguo">
  <defs>
    <!-- 品牌渐变：与 .grad 标题渐变同源 -->
    <linearGradient id="cgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#8fc4ff"/>
      <stop offset="55%"  stop-color="#c4a0ff"/>
      <stop offset="100%" stop-color="#ffb3d9"/>
    </linearGradient>
    <!-- 玻璃质感高光 -->
    <linearGradient id="cgGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="45%"  stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 渐变底牌 -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#cgGrad)"/>
  <!-- 玻璃高光 -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#cgGloss)"/>
  <!-- 一圈细描边，增加精致感 -->
  <rect x="3" y="3" width="58" height="58" rx="17"
        fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="1.25"/>

  <!-- 白色几何字母 G -->
  <path d="M41.96 23.64A13 13 0 1 0 41.96 40.36L41.96 32L33 32"
        fill="none" stroke="#ffffff" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>