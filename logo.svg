<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="loop1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8fc4ff" />
      <stop offset="100%" stop-color="#c4a0ff" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="loop2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb3d9" />
      <stop offset="100%" stop-color="#8fc4ff" stop-opacity="0.5" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#glow)">
    <!-- 左半边圆环 -->
    <circle cx="35" cy="50" r="22" fill="none" stroke="url(#loop1)" stroke-width="8" stroke-linecap="round" />
    <!-- 右半边圆环 -->
    <circle cx="65" cy="50" r="22" fill="none" stroke="url(#loop2)" stroke-width="8" stroke-linecap="round" />
    <!-- 中心交织点 -->
    <circle cx="50" cy="50" r="4" fill="#ffffff" />
  </g>
</svg>