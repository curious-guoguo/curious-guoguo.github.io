<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sidebar"></div>

    <!-- 你的首页原有内容，100%保留 -->
    <main class="main-content">
        <div class="head-title">
            Hi<br>I'm 曾轶峡
        </div>

        <div class="visit-count">
            这里一共有 
            <img src="https://w.saobby.com/w/50x439dc" alt="访问ID数" loading="lazy"> 
            个ID访问，总共 
            <img src="https://w.saobby.com/w/x6o8wm41" alt="访问次数" loading="lazy"> 
            次
        </div>

        <div class="coding-text">写代码写代码写代码</div>
        <div class="gif-row">
            <img src="https://i.loli.net/2018/10/29/5bd644bb4f0ba.gif" loading="lazy">
            <img src="https://i.loli.net/2018/10/29/5bd644bb4f0ba.gif" loading="lazy">
            <img src="https://i.loli.net/2018/10/29/5bd644bb4f0ba.gif" loading="lazy">
        </div>
        <div class="gif-row">
            <img src="https://oj.mimadao.com/avatar/5028_1639918955674.gif" loading="lazy">

        </div>
    </main>

    <!-- 修正后的加载+高亮JS -->
    <script>
    fetch('sidebar.html')
    .then(res => res.text())
    .then(html => {
        document.getElementById('sidebar').innerHTML = html;
        // 高亮当前页面
        let currentFile = window.location.href.split('/').pop();
        document.querySelectorAll('.sidebar a').forEach(item => {
            if(item.getAttribute('href') === currentFile) {
                item.classList.add('active');
            }
        });
    });
    </script>
</body>
</html>
